# Floorplan information - core boundary coordinates, std. cell row height,
# minimum track pitch as defined in LEF

set ::halo 4

# POWER or GROUND #Std. cell rails starting with power or ground rails at the bottom of the core area
set ::rails_start_with "POWER" ;

# POWER or GROUND #Upper metal stripes starting with power or ground rails at the left/bottom of the core area
set ::stripes_start_with "POWER" ;

# Power nets
set ::power_nets "VDD"
set ::ground_nets "VSS"

##===> Power grid strategy
# Ensure pitches and offsets will make the stripes fall on track
pdngen::specify_grid stdcell {
    name grid
    rings_number 4
    core_ring {
        metal1 {width 3  spacing  3.0 core_offset 5}
        metal2 {width 3  spacing  3.0 core_offset 5}
        metal3 {width 3  spacing  3.0 core_offset 5}
        metal4 {width 3  spacing  3.0 core_offset 5}
        metal5 {width 3  spacing  3.0 core_offset 5}
        metal6 {width 3  spacing  3.0 core_offset 5}
        metal7 {width 3  spacing  3.0 core_offset 5}
        metal8 {width 3  spacing  3.0 core_offset 5}
        }
    gnd_pads {
        VSS GPAD
    }
    pwr_pads {
        VDD PPAD
    }
    connect {
        {metal1 metal2} {metal2 metal3} {metal3 metal4} {metal4 metal5} {metal5 metal6} {metal6 metal7} {metal7 metal8}
    }
}

# enable icb-mode
#
# The mode will figure out suitable width and spacing.
# By default, density is assumed between 66.6% and 75.0%.
# If it is not the case, please specify pdngen::icb_min_density and pdngen::icb_max_density.
set pdngen::icb_mode true
# set pdngen::icb_min_density 66.6
# set pdngen::icb_max_density 75.0
