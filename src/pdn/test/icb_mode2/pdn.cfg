# Floorplan information - core boundary coordinates, std. cell row height,
# minimum track pitch as defined in LEF

set ::halo 4

# POWER or GROUND #Std. cell rails starting with power or ground rails at the bottom of the core area
set ::rails_start_with "POWER" ;

# POWER or GROUND #Upper metal stripes starting with power or ground rails at the left/bottom of the core area
set ::stripes_start_with "POWER" ;

# Power nets
set ::power_nets "VDD"
set ::ground_nets "VSS"

##===> Power grid strategy
# Ensure pitches and offsets will make the stripes fall on track

puts "starting power rail on M1"
set pdngen::icb_mode true
pdngen::specify_grid stdcell {
    name grid
    rings_number 7
    pwr_pads {VDD {PVDD1CDG}}
    gnd_pads {VSS {PVSS1CDG}}
    rails {
        M1 {width 0.33 pitch 1.80 offset 0}
    }
    straps {
        M6 {width 1 pitch 16.4 offset 4.1}
        M7 {width 3.00 pitch 9 offset 3}
        M8 {width 4.00 pitch 12 offset 4}
        M9 {width 3.00 pitch 10 offset 5}
    }
    core_ring {
        M1 {width 4.5  spacing  2.0 core_offset 5}
        M2 {width 4.5  spacing  2.0 core_offset 5}
        M3 {width 4.5  spacing  2.0 core_offset 5}
        M4 {width 4.5  spacing  2.0 core_offset 5}
        M5 {width 4.5  spacing  2.0 core_offset 5}
        M6 {width 4.5  spacing  2.0 core_offset 5}
        M7 {width 4.5  spacing  2.0 core_offset 5}
        M8 {width 4.5  spacing  2.0 core_offset 5}
        M9 {width 4.5  spacing  2.0 core_offset 5}
    }
    connect {{M1 M2} {M1 M6} {M1 M8} {M2 M9}}
}

pdngen::specify_grid macro {
    orient {R0 R180 R270 R90 MX MY}
    power_pins "VDD"
    ground_pins "VSS"
    blockages "M1 M2 M3 M4 "
    connect {{M4_PIN_hor M6}}
}


