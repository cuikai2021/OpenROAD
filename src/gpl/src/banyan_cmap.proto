syntax = "proto3";  
package banyan; 
option go_package = "/pb";

message Tile {
    double supply = 1;
    double demand = 2;
    bool active = 3;
}

message Cmap {
    int64 wgrids = 1;
    int64 hgrids = 2;
    double tileWidth = 3;
    double tileHeight = 4;
    repeated Tile vtiles = 5;
    repeated Tile htiles = 6;
}