syntax = "proto3";

package lrl_tdp; 

//for all double value, 1e+30 means INF

message Arg {
    double gradient = 1;
    double lower_boundary = 2;
    double upper_boundary = 3;
}

message Capacitance {
    // unit: 1 farad
    double load_cap = 1; // current load cap
    double max_cap = 2; // load cap limit
}

message Delay {
    // unit: 1 second
    double seconds = 1;
}

// only non-sequential internal arcs
message Arc {
    bytes instance = 1;
    bytes pin_start = 2;
    bytes pin_end = 3;

    Delay input_slack = 4;
    Delay output_slack = 5;
    Delay input_arrival = 6;
    Delay output_arrival = 7;
    Delay arc_delay = 8;
    Capacitance capacitance = 9;

    Arg delay_loadcap_arg = 10;
    Arg delay_slope_arg = 11;
    Arg transition_loadcap_arg = 12;
    Arg transition_slope_arg = 13;

    Delay input_slew = 14;
    Delay output_slew = 15;
}

message Port {
    bytes port_name = 1;

    oneof in_or_out {
        Capacitance capacitance = 2;  // exist when signal = in
        Delay output_slack = 3; // exist when signal = out
    }

    Delay arrival = 4;
    Delay slew = 5;
}

message SeqPin {
    bytes instance = 1;
    bytes pin = 2;

    oneof in_or_out {
        Capacitance cap = 3; // exist when signal = start
        Arg setup_slope_arg = 4; // exist when signal = end
    }

    Delay slack = 5;

    Delay arrival = 6;
    Delay slew = 7;
}

message IncrTdpData {
    bytes mode = 1;
    bytes corner = 2;
    repeated Arc arcs = 3;
    repeated Port ports = 4;
    repeated SeqPin seq_pins = 5;

    double wire_cap = 6;
    double wire_res = 7;
}

message TdpData {
    repeated IncrTdpData data = 1;
}
