syntax = "proto3";
package pblefdef;

message LibraryExchangeFormat {
    Version version = 1;
    BusBitChars bus_bit_chars = 2;
    DividerChar divider_char = 3;

    oneof optional_manufacturing_grid {
        int64 manufacturing_grid = 4; // in picometres
    }

    enum ClearanceMeasure {
        EUCLIDEAN = 0;
        MAXXY = 1;
    }
    oneof optional_clearance_measure {
        ClearanceMeasure clearance_measure = 5;
    }

    bool fixed_mask = 6;

    message UseMinSpacing {
        bool obs = 1;
    }
    UseMinSpacing use_min_spacing = 7;

    Units units = 8;
    repeated PropertyDefinition property_definitions = 9;

    message Site {
        bytes name = 1;

        enum Class {
            PAD = 0;
            CORE = 1;
        }
        Class class = 2;
        Size size = 3;
        Symmetry symmetry = 4;
    }
    repeated Site sites = 10;

    message Layer {
        reserved 3;

        bytes name = 1;

        oneof optional_mask {
            int64 mask = 2;
        }

        enum Measure {
            PEAK = 0;
            AVERAGE = 1;
            ROOT_MEAN_SQUARE = 2;
        }

        message MasterSlice {}
        message Overlap {}
        message Cut {
            message Spacing {
                int64 cut_spacing = 1; // in picometres
                bool center_to_center = 2;
                bool same_net = 3;

                message SecondLayer {
                    bytes name = 1;
                    bool stack = 2;
                }
                message AdjacentCuts {
                    int64 adjacent_cuts = 1;
                    int64 within = 2; // in picometres
                    bool except_same_pg_net = 3;
                }
                message ParallelOverlap {
                }
                oneof rule {
                    SecondLayer second_layer = 4;
                    AdjacentCuts adjacent_cuts = 5;
                    ParallelOverlap parallel_overlap = 6;
                    int64 area = 7; // in pm^2
                }
            }
            repeated Spacing spacing = 1;

            message SpacingEntry {
                int64 cut_within = 1; // in picometres
                int64 orthogonal_spacing = 2; // in picometres
            }
            repeated SpacingEntry spacing_table = 2;

            oneof optional_width {
                int64 width = 3; // in picometres
            }

            message Enclosure {
                enum Position {
                    BOTH = 0;
                    ABOVE = 1;
                    BELOW = 2;
                }
                Position position = 1;
                int64 overhang1 = 2; // in picometres
                int64 overhang2 = 3; // in picometres

                message EnclosureWidth {
                    int64 min_width = 1; // in picometres

                    oneof optional_except_extra_cut {
                        int64 cut_within = 2; // in picometres
                    }
                }
                oneof width_or_length {
                    EnclosureWidth width = 4;
                    int64 length = 5; // in picometres
                }
            }
            repeated Enclosure enclosures = 4;

            message AcCurrentDensity {
                Measure measure = 1;

                message Table {
                    repeated double frequencies = 1; // MHz
                    repeated int64 cut_areas = 2; // in pm^2
                    repeated double currents = 3; // in mA/um
                }
                oneof density {
                    double value = 2; // in mA/um
                    Table table = 3;
                }
            }
            repeated AcCurrentDensity ac_current_densities = 5;

            message DcCurrentDensity {
                message Table {
                    repeated int64 cut_areas = 1; // in pm^2
                    repeated double currents = 2; // in mA/um
                }
                oneof density {
                    double value = 1; // in mA/um
                    Table table = 2;
                }
            }
            DcCurrentDensity dc_current_density = 6;

            message Lef58Spacing {
                int64 cut_spacing = 1; // in pm
            }
            repeated Lef58Spacing lef58_spacing = 7;
        }
        message Routing {
            enum Direction {
                HORIZONTAL = 0;
                VERTICAL = 1;
                DIAG45 = 2;
                DIAG135 = 3;
            }
            Direction direction = 1;

            message Pitch {
                int64 x = 1; // in picometres
                int64 y = 2; // in picometres.
            }
            Pitch pitch = 2;

            int64 default_width = 3; // in picometres

            message Offset {
                int64 x = 1; // in picometres
                int64 y = 2; // in picometres
            }
            Offset offset = 4;

            oneof optional_height {
                int64 height = 5; // in picometres
            }

            oneof optional_thickness {
                int64 thickness = 6; // in picometres
            }

            oneof optional_fill_active_spacing {
                int64 fill_active_spacing = 7; // in picometres
            }

            oneof optional_max_width {
                int64 max_width = 8;  // in picometres
            }

            oneof optional_min_width {
                int64 min_width = 9; // in picometres
            }

            oneof optional_min_area {
                int64 min_area = 10; // in pm^2
            }

            message MinEnclosedArea {
                int64 area = 1; // in pm^2
                oneof optional_width {
                    int64 width = 2; // in picometres
                }
            }
            repeated MinEnclosedArea min_enclosed_areas = 11;

            message MinimumCut {
                int64 num_cuts = 1;
                int64 width = 2; // in picometres
                oneof optional_cut_distance {
                    int64 cut_distance = 3; // in picometres
                }

                enum ConnectFrom {
                    FROM_BOTH = 0;
                    FROM_ABOVE = 1;
                    FROM_BELOW = 2;
                }
                ConnectFrom from = 4;

                message MinCutLength {
                    int64 length = 1; // in picometres
                    int64 distance = 2; // in picometres
                }
                MinCutLength length = 5;
            }
            repeated MinimumCut min_cuts = 12;

            oneof optional_min_density {
                double min_density = 13; // in percentages
            }

            oneof optional_max_density {
                double max_density = 14; // in percentages
            }

            message AcCurrentDensity {
                Measure measure = 1;

                message Table {
                    repeated double frequencies = 1; // MHz
                    repeated int64 widths = 2; // in pm
                    repeated double currents = 3; // in mA/um
                }
                oneof density {
                    double value = 2; // in mA/um
                    Table table = 3;
                }
            }
            repeated AcCurrentDensity ac_current_densities = 15;

            message DcCurrentDensity {
                message Table {
                    repeated int64 widths = 1; // in pm
                    repeated double currents = 2; // in mA/um
                }
                oneof density {
                    double value = 1; // in mA/um
                    Table table = 2;
                }
            }
            DcCurrentDensity dc_current_density = 16;

            message SpacingRule {
                int64 min_spacing = 1; // in pm

                message SecondRange {
                    int64 min_width = 1; // in pm
                    int64 max_width = 2; // in pm
                }
                message Range {
                    int64 min_width = 1; // in pm
                    int64 max_width = 2; // in pm

                    message UseLengthThreshold {
                    }
                    message Influence {
                        int64 length = 1; // in pm
                        SecondRange second_range = 2;
                    }

                    oneof subfilter {
                        UseLengthThreshold use_length_threshold = 3;
                        Influence influence = 4;
                        SecondRange second_range = 5;
                    }
                }
                message LengthThreshold {
                    int64 max_length = 1; // in pm
                    SecondRange second_range = 2;
                }
                message EndOfLine {
                    int64 eol_width = 1; // in pm
                    int64 eol_within = 2; // in pm

                    message ParallelEdge {
                        int64 space = 1; // in pm
                        int64 within = 2; // in pm
                        bool two_edge = 3;
                    }
                    ParallelEdge parallel_edge = 3;
                }
                message SameNet {
                    bool pg_only = 1;
                }
                message NotchLength {
                    int64 min_length = 1; // in pm
                }
                message EndOfNotchWidth {
                    int64 end_of_notch_width = 1; // in pm
                    int64 min_notch_spacing = 2; // in pm
                    int64 min_notch_length = 3; // in pm
                }

                oneof condition {
                    Range range = 2;
                    LengthThreshold length_threshold = 3;
                    EndOfLine end_of_line = 4;
                    SameNet same_net = 5;
                    NotchLength notch_length = 6;
                    EndOfNotchWidth end_of_notch_width = 7;
                }
            }
            repeated SpacingRule spacing_rules = 17;

            message ParallelRunLengthSpacingTable {
                repeated int64 length_rulers = 1; // in pm
                repeated int64 width_rulers = 2; // in pm
                repeated int64 spacings = 3; // in pm
            }
            message TwoWidthsSpacingTable {
                message WidthRuler {
                    int64 width = 1; // in pm
                    oneof optional_parallel_run_length {
                        int64 parallel_run_length = 2; // in pm
                    }
                }
                repeated WidthRuler width_rulers = 1;
                repeated int64 spacings = 2; // in pm
            }
            oneof optional_spacing_table {
                ParallelRunLengthSpacingTable prl = 18;
                TwoWidthsSpacingTable two_widths = 19;
            }
        }
        message Implant {
            oneof optional_width {
                int64 min_width = 1; // in pm
            }

            message Spacing {
                int64 min_spacing = 1; // in pm

                oneof optional_second_layer {
                    bytes second_layer = 2;
                }
            }
            repeated Spacing spacing = 2;
        }
        oneof layer_instance {
            MasterSlice master_slice = 4;
            Overlap overlap = 5;
            Cut cut = 6;
            Routing routing = 7;
            Implant implant = 8;
        }
    } // layer
    repeated Layer layers = 11;

    message Macro {
        bytes name = 1;

        message ClassCore {
            enum Type {
                FEED_THRU = 0;
                TIE_HIGH = 1;
                TIE_LOW = 2;
                SPACER = 3;
                ANTENNA_CELL = 4;
                WELL_TAP = 5;
            }
            oneof optional_type {
                Type type = 1;
            }
        }
        message ClassCover {
            bool bump = 1;
        }
        message ClassRing {}
        message ClassBlock {
            enum Option {
                BLACKBOX = 0;
                SOFT = 1;
            }
            oneof optional_opt {
                Option option = 1;
            }
        }
        message ClassPad {
            enum Type {
                INPUT = 0;
                OUTPUT = 1;
                IN_OUT = 2;
                POWER = 3;
                SPACER = 4;
                AREA_IO = 5;
            }
            oneof optional_type {
                Type type = 1;
            }
        }
        message ClassEndcap {
            enum Type {
                PRE = 0;
                POST = 1;
                TOP_LEFT = 2;
                TOP_RIGHT = 3;
                BOTTOM_LEFT = 4;
                BOTTOM_RIGHT = 5;
            }
            oneof optional_type {
                Type type = 1;
            }
        }
        oneof class {
            ClassCore class_core = 2;
            ClassCover class_cover = 3;
            ClassRing class_ring = 4;
            ClassBlock class_block = 5;
            ClassPad class_pad = 6;
            ClassEndcap class_endcap = 7;
        }

        message Foreign {
            bytes name = 1;
            Point origin = 2;
        }
        repeated Foreign foreigns = 8;

        Point origin = 9;
        Size size = 10;
        Symmetry symmetry = 11;

        message SiteRef {
            bytes name = 1;
        }
        repeated SiteRef sites = 12;

        message Pin {
            bytes name = 1;

            oneof optional_pin_dir {
                PinDirection direction = 2;
            }

            oneof optional_use {
                Use use = 3;
            }

            message Port {
                enum PortClass {
                    NONE = 0;
                    CORE = 1;
                    BUMP = 2;
                }
                repeated LayerGeometry layer_geometries = 1;
                oneof optional_class {
                    PortClass class = 2;
                }
            }
            repeated Port ports = 4;

            enum Shape {
                ABUTMENT = 0;
                RING = 1;
                FEEDTHRU = 2;
            }
            oneof optional_shape {
                Shape shape = 5;
            }
        }
        repeated Pin pins = 13;

        message Obs {
            repeated LayerGeometry layers = 1;
        }
        Obs obs = 14;
    } // Macro
    repeated Macro macros = 12;

    message ViaRuleGenerate {
        bytes name = 1;
        bool default = 2;

        message RouteableLayerViaRule {
            bytes layer_name = 1;
            int64 overhang1 = 2; // in picometres
            int64 overhang2 = 3; // in picometres

            message WidthRange {
                int64 min_width = 1; // in picometres
                int64 max_width = 2; // in picometres
            }
            WidthRange width_range = 4;
        }

        RouteableLayerViaRule lower_routeable = 3;
        RouteableLayerViaRule upper_routeable = 4;

        message CutLayerViaRule {
            bytes layer_name = 1;
            Rect shape = 2;
            Point spacing = 3;

            oneof optional_resistance {
                double resistance_per_cut = 4;
            }
        }
        CutLayerViaRule cut = 5;
    }
    repeated ViaRuleGenerate via_rule_generates = 13;

    repeated Via vias = 14;
}

message DesignExchangeFormat {
    Version version = 1;
    BusBitChars bus_bit_chars = 2;
    DividerChar divider_char = 3;
    oneof optional_design {
        bytes design = 4;
    }
    oneof optional_dbu {
        Units.DbFactor dbu = 5;
    }

    message DieArea {
        repeated Point points = 1;
    }
    DieArea die_area = 6;

    message Row {
        bytes name = 1;
        bytes site_name = 2;
        Point start = 3;
        Orient orient = 4;

        message Repeat {
            int64 x_num = 1;
            int64 y_num = 2;
            Point step = 3;
        }
        Repeat repeat = 5;
    }
    repeated Row rows = 7;

    message Component {
        bytes name = 1;
        bytes model_name = 2;

        enum Source {
            NETLIST = 0;
            DIST = 1;
            TIMING = 2;
            USER = 3;
        }
        oneof optional_source {
            Source source = 3;
        }

        Place place = 4; // this field will be unpresented if the component is unplaced.

        message Halo {
            bool soft = 1;
            int64 left = 2; // in pm
            int64 right = 3; // in pm
            int64 top = 4; // in pm
            int64 bottom = 5; // in pm
        }
        Halo halo = 5;
        repeated Property properties = 6;

        oneof optional_weight {
            int64 weight = 7;
        }

        message RouteHalo {
            int64 halo_dist = 1; // in pm
            bytes min_layer = 2;
            bytes max_layer = 3;
        }
        RouteHalo route_halo = 8;

        oneof optional_eeq {
            bytes eeq = 9;
        }

        oneof optional_mask_shift {
            uint64 mask_shift = 10;
        }

        oneof optional_region {
            bytes region = 11;
        }
    }
    repeated Component components = 8;

    message Pin {
        bytes name = 1;
        bytes net_name = 2;

        oneof optional_pin_dir {
            PinDirection direction = 3;
        }
        oneof optional_use {
            Use usage = 4;
        }

        message Port {
            message RectPort {
                bytes name = 1;
                Rect shape = 2;
            }
            repeated RectPort layers = 1;

            message PolygonPort {
                bytes name = 1;
                Polygon shape = 2;
            }
            repeated PolygonPort polygons = 2;

            DesignExchangeFormat.Place place = 3;

            message ViaPort {
                bytes name = 1;
                Point place = 2;
            }
            repeated ViaPort vias = 4;
        }
        repeated Port ports = 5;

        bool special = 6;
    }
    repeated Pin pins = 9;

    message Net {
        bytes name = 1; // if it's a mustjoin net, the name is no more than a placeholder.

        message PinRef {
            message CellPinRef {
                bytes cell_name = 1;
                bytes pin_name = 2;
            }
            oneof pin {
                bytes io = 1;
                CellPinRef cell = 2;
            }

            bool synthesized = 3;
        }
        repeated PinRef pins = 2;

        oneof optional_use {
            Use usage = 3;
        }

        enum Source {
            DIST = 0;
            NETLIST = 1;
            TEST = 2;
            TIMING = 3;
            USER = 4;
        }
        oneof optional_source {
            Source source = 4;
        }

        oneof optional_weight {
            int64 weight = 5;
        }

        repeated Property properties = 6;

        enum Pattern {
            BALANCED = 0;
            STEINER = 1;
            TRUNK = 2;
            WIRED_LOGIC = 3;
        }
        oneof optional_pattern {
            Pattern pattern = 7;
        }

        message Wiring {
            enum Type {
                COVER = 0;
                FIXED = 1;
                ROUTED = 2;
                NO_SHIELD = 3;
                TAPER = 4;
            }
            Type type = 1;

            message Segment {
                bytes layer = 1;

                message Taper {
                }
                message TaperRule {
                    bytes rule_name = 1;
                }
                oneof optional_taper {
                    Taper taper = 2;
                    TaperRule taper_rule = 3;
                }

                oneof optional_style {
                    uint64 style = 4;
                }

                message RoutePoint {
                    message ViaCorner {
                        bytes via_name = 1;
                        oneof optional_mask {
                            uint32 mask = 2;
                        }
                        oneof optional_orient {
                            Orient orient = 3;
                        }
                    }
                    message RectCorner {
                        oneof optional_mask {
                            uint32 mask = 1;
                        }
                        Rect relative_rect = 2;
                    }
                    message VirtualCorner {
                        Point point = 1;
                    }
                    oneof required_corner {
                        DesignExchangeFormat.SpecialNet.Wiring.Segmented.Segment.RoutePoint.MetalCorner metal = 1;
                        ViaCorner via = 2;
                        RectCorner rect = 3;
                        VirtualCorner virtual = 4;
                    }
                }
                repeated RoutePoint points = 5;
            }
            repeated Segment segments = 2;
        }
        repeated Wiring wiring = 8;

        message MustJoin {
            bytes component = 1;
            bytes pin = 2;
        }
        MustJoin must_join = 9;

        message ShieldNet {
            bytes net_name = 1;
        }
        repeated ShieldNet shield_nets = 10;

        message Vpin {
            bytes name = 1;
            Point point0 = 2;
            Point point1 = 3;

            oneof optional_layer {
                bytes layer = 4;
            }

            DesignExchangeFormat.Place optional_place = 5;
        }
        repeated Vpin vpins = 11;

        uint32 xtalk = 12;

        message NonDefaultRule {
            bytes rule_name = 1;
        }
        NonDefaultRule ndr = 13;

        bool fixed_bump = 14;

        oneof optional_frequency {
            double frequency = 15;
        }

        oneof optional_original {
            bytes original = 16;
        }

        oneof optional_estcap {
            double estcap = 17;
        }
    }
    repeated Net nets = 10;

    message Blockages {
        message Placement {
            repeated Rect geo = 1;

            message Soft {}
            oneof placeable {
                Soft soft = 2;
                float partial = 3;
            }

            bool push_down = 4;

            oneof optional_component {
                bytes component = 5;
            }
        }
        repeated Placement placement = 1;

        message Route {
            bytes layer = 1;

            message Slots {}
            message Fills {}
            oneof slotsOrFillls {
                Slots slots = 2;
                Fills fills = 3;
            }

            bool push_down = 4;
            bool except_pg_net = 5;

            oneof optional_component {
                bytes component = 6;
            }

            message Spacing {
                int64 min_spacing = 1; // in pm
            }
            message DesignRuleWidth {
                int64 effective_width = 1; // in pm
            }
            oneof spacingOrDesignRuleWidth {
                Spacing spacing = 7;
                DesignRuleWidth design_rule_width = 8;
            }

            oneof optional_mask {
                uint64 mask = 9;
            }

            repeated Rect rects = 10;
            repeated Polygon polygons = 11;
        }
        repeated Route route = 2;
    }
    Blockages blockages = 11;

    message Place {
        enum Type {
            FIXED = 0;
            COVER = 1;
            PLACED = 2;
        }
        Type type = 1;
        Point position = 2;
        Orient orient = 3;
    }

    message PropertyDefinition {
        enum ObjectType {
            COMPONENT = 0;
            COMPONENTPIN = 1;
            DESIGN = 2;
            GROUP = 3;
            NET = 4;
            NONDEFAULTRULE = 5;
            REGION = 6;
            ROW = 7;
            SPECIALNET = 8;
        }
        ObjectType object_type = 1;

        bytes prop_name = 2;

        enum PropType {
            INTEGER = 0;
            REAL = 1;
            STRING = 2;
        }
        PropType prop_type = 3;

        message Range {
            bytes start = 1;
            bytes end = 2;
        }
        oneof optional_range {
            Range range = 4;
        }
        oneof optional_value {
            bytes value = 5;
        }
    }

    repeated PropertyDefinition property_definition = 12;

    message Track {
        message Mask {
            int64 num = 1;
            bool same = 2;
        }

        LineDirection direction = 1;
        int64 start = 2;
        int64 numtracks = 3;
        int64 space = 4;
        Mask mask = 5;
        repeated bytes layer_names = 6;
    }
    repeated Track tracks = 13;

    message GCellGrid {
        LineDirection direction = 1;
        int64 start = 2;
        int64 num_plus_1 = 3;
        int64 space = 4;
    }

    repeated GCellGrid gcell_grids = 14;

    message SpecialNet {
        bytes name = 1;
        repeated DesignExchangeFormat.Net.PinRef pins = 2;

        oneof optional_voltage {
            int64 voltage = 3; // in units of 0.001 V
        }
        oneof optional_source {
            DesignExchangeFormat.Net.Source source = 4;
        }
        bool fixed_bump = 5;

        oneof optional_original {
            bytes original = 6;
        }

        oneof optional_use {
            Use usage = 7;
        }

        oneof optional_pattern {
            DesignExchangeFormat.Net.Pattern pattern = 8;
        }

        oneof optional_estimated_capacitance {
            double estimated_capacitance = 9;
        }

        oneof optional_weight {
            int64 weight = 10;
        }

        message Wiring {
            message Cover {
            }
            message Fixed {
            }
            message Routed {
            }
            message Shield {
                bytes shield_net_name = 1;
            }

            enum Shape {
                RING = 0;
                PAD_RING = 1;
                BLOCK_RING = 2;
                STRIPE = 3;
                FOLLOW_PIN = 4;
                IO_WIRE = 5;
                CORE_WIRE = 6;
                BLOCK_WIRE = 7;
                BLOCKAGE_WIRE = 8;
                FILL_WIRE = 9;
                FILL_WIRE_OPC = 10;
                DRC_FILL = 11;
            }

            message RawDraw {
                oneof optional_type {
                    Cover cover = 1;
                    Fixed fixed = 2;
                    Routed routed = 3;
                    Shield shield = 4;
                }

                oneof optional_shape {
                    Shape shape = 5;
                }

                oneof optional_mask {
                    uint64 mask = 6;
                }

                message RectDraw {
                    bytes layer = 1;
                    Rect shape = 2;
                }
                message PolygonDraw {
                    bytes layer = 1;
                    Polygon shape = 2;
                }
                message ViaDraw {
                    bytes via = 1;

                    oneof optional_orient {
                        Orient orient = 2;
                    }

                    repeated Point points = 3;
                }
                oneof required_draw {
                    RectDraw rect = 7;
                    PolygonDraw polygon = 8;
                    ViaDraw via = 9;
                }
            }
            message Segmented {
                oneof required_type {
                    Cover cover = 1;
                    Fixed fixed = 2;
                    Routed routed = 3;
                    Shield shield = 4;
                }

                message Segment {
                    bytes layer_name = 1;
                    int64 route_width = 2; // in pm

                    oneof optional_shape {
                        Shape shape = 3;
                    }

                    oneof optional_style {
                        int64 style = 4;
                    }

                    message RoutePoint {
                        message MetalCorner {
                            Point point = 1; // required
                            oneof optional_ext_value {
                                int64 ext_value = 2; // in pm
                            }
                            oneof optional_mask {
                                int64 mask = 3;
                            }
                        }
                        message ViaCorner {
                            bytes via_name = 1;
                            oneof optional_mask {
                                uint32 mask = 2;
                            }
                            oneof optional_orient {
                                Orient orient = 3;
                            }

                            message Array {
                                int64 n_rows = 1;
                                int64 n_cols = 2;
                                Point step = 3;
                            }
                            oneof optional_array {
                                Array array = 4;
                            }
                        }
                        oneof metal_or_via {
                            MetalCorner metal = 1;
                            ViaCorner via = 2;
                        }
                    }
                    repeated RoutePoint points = 5;
                }
                repeated Segment segments = 5;
            }
            oneof required_wire {
                RawDraw raw_draw = 1;
                Segmented segmented = 2;
            }
        }
        repeated Wiring wiring = 11;

        repeated Property properties = 12;
    }
    repeated SpecialNet special_nets = 15;

    repeated Via vias = 16;

    message Region {
        bytes name = 1;
        Rect shape = 2;
    }
    repeated Region regions = 17;

    message Group {
        bytes name = 1;
        repeated bytes component_names = 2;
        oneof optional_region_name {
            bytes region_name = 3;
        }
        repeated Property properties = 4;
    }
    repeated Group groups = 18;
}

message Version {
    uint32 major = 1;
    uint32 minor = 2;
    uint32 rev = 3;
}

message BusBitChars {
    bytes content = 1;
}

message DividerChar {
    bytes content = 1;
}

message Units {
    oneof optional_time {
        int64 nanoseconds = 1;
    }

    oneof optional_capacitance {
        int64 picofarads = 2;
    }

    oneof optional_resistance {
        int64 ohms = 3;
    }

    oneof optional_power {
        int64 milliwatts = 4;
    }

    oneof optional_current {
        int64 milliamps = 5;
    }

    oneof optional_voltage {
        int64 volts = 6;
    }

    enum DbFactor {
        V100 = 0;
        V200 = 1;
        V400 = 2;
        V800 = 3;
        V1000 = 4;
        V2000 = 5;
        V4000 = 6;
        V8000 = 7;
        V10000 = 8;
        V20000 = 9;
    }
    oneof optional_db {
        DbFactor database = 7;
    }

    oneof optional_frequency {
        int64 megahertz = 8;
    }
}

message PropertyDefinition {
    enum ObjectType {
        LAYER = 0;
        LIBRARY = 1;
        MACRO = 2;
        NONDEFAULTRULE = 3;
        PIN = 4;
        VIA = 5;
        VIARULE = 6;
    }
    ObjectType object_type = 1;

    bytes prop_name = 2;

    enum PropType {
        INTEGER = 0;
        REAL = 1;
        STRING = 2;
    }
    PropType prop_type = 3;

    message Range {
        bytes start = 1;
        bytes end = 2;
    }
    oneof value {
        bytes single = 4; // when propType is STRING, surrounding '"'s are included.
        Range range = 5;
    }
}

message Point {
    int64 x = 1; // in picometres
    int64 y = 2; // in picometres
}

enum Orient {
    NORTH = 0;
    SOUTH = 1;
    EAST = 2;
    WEST = 3;
    FLIPPED_NORTH = 4;
    FLIPPED_SOUTH = 5;
    FLIPPED_EAST = 6;
    FLIPPED_WEST = 7;
}

message Size {
    int64 width = 1; // in picometres
    int64 height = 2; // in picometres
}

message Symmetry {
    enum On {
        X = 0;
        Y = 1;
        R90 = 2;
    }
    repeated On ons = 1;
}

enum PinDirection {
    INPUT = 0;
    OUTPUT = 1;
    TRISTATE_OUTPUT = 2;
    IN_OUT = 3;
    FEED_THRU = 4;
}

enum LineDirection {
    X = 0;
    Y = 1;
}

enum Use {
    SIGNAL = 0;
    ANALOG = 1;
    POWER = 2;
    GROUND = 3;
    CLOCK = 4;
    TIE_OFF = 5;
    SCAN = 6;
    RESET = 7;
}

message LayerGeometry {
    bytes layer_name = 1;

    message LayerRect {
        Rect shape = 1;
    }
    repeated LayerRect rects = 2;

    message LayerPolygon {
        Polygon shape = 1;
    }
    repeated LayerPolygon polygons = 3;
}

message Rect {
    int64 llx = 1; // in picometres
    int64 lly = 2; // in picometres
    int64 urx = 3; // in picometres
    int64 ury = 4; // in picometres
}

message Polygon {
    // A sequence of adjacent corners, either clockwise or anti-clockwise, w.r.t., LEF-5.8 std.
    repeated Point corners = 1;
}

message Property {
    bytes name = 1;
    bytes value = 2;
}

message Via {
    bytes name = 1;
    bool default = 2;

    message Fixed {
        oneof optional_resistance {
            double resistance = 1;
        }

        message ViaShape {
            bytes layer_name = 1;
            oneof optional_mask {
                int64 mask = 2;
            }
            oneof rect_or_polygon {
                Rect rect = 3;
                Polygon polygon = 4;
            }
        }
        repeated ViaShape shapes = 2;
    }
    message Generated {
        bytes via_rule_name = 1;
        Size cut_size = 2;
        bytes lower_metal_layer = 3;
        bytes cut_layer = 4;
        bytes upper_metal_layer = 5;
        Point cut_spacing = 6;
        Point lower_enclosure = 7;
        Point upper_enclosure = 8;

        message RowCol {
            int64 n_rows = 1;
            int64 n_cols = 2;
        }
        RowCol row_col = 9;

        Point origin = 10;

        message Offset {
            Point lower = 1;
            Point upper = 2;
        }
        Offset offset = 11;
    }
    oneof fixed_or_generated {
        Fixed fixed = 3;
        Generated generated = 4;
    }
}
