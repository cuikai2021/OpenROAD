name: release eden deps docker
on: [workflow_dispatch]

jobs:
  release-eden-deps-docker:
    runs-on: [self-hosted]

    steps:
      - name: 1. checkout eden
        uses: actions/checkout@v2

      - name: 2. checkout bamboo
        uses: actions/checkout@v2
        with:
          repository: zynICBench/bamboo
          ref: master
          token: ${{ secrets.DEVOPS_GITHUB_ACCESSTOKEN }}
          path: ${{ github.workspace }}/bamboo

      - name: 3. download from aliyun
        run: |
          pip install oss2
          python3 ${{github.workspace}}/bamboo/aliyun_oss/aliyun.py download ${{ secrets.ALI_OSS_ACCESS_KEY_ID }} ${{ secrets.ALI_OSS_ACCESS_KEY_SK }} oss://icbench-static/environments/${{ github.repository }}/${{ github.ref }}/env.json env.json

      - name: 4. make varibles in json file into environment
        uses: antifree/json-to-variables@v1.0.1
        with:
          filename: "env.json"
          prefix: env

      - name: 5. combine and create DEPS_ENV
        if: ${{ env.env_IS_FILES_MODIFIED_OR_ADDED == 'true' }}
        run: python3 ${{github.workspace}}/bamboo/json/latest_image.py ${{ env.env_DEPS_ENV_PREFIX }} ${{ github.run_number }} ${{ github.workspace }}

      - name: 6. login to acr
        if: ${{ env.env_IS_FILES_MODIFIED_OR_ADDED == 'true' }}
        uses: docker/login-action@v1
        with:
          registry: ${{ env.env_DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: 7. build and push docker
        if: ${{ env.env_IS_FILES_MODIFIED_OR_ADDED == 'true' }}
        uses: docker/build-push-action@v2
        with:
          registry: ${{ env.env_DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
          context: .
          file: ${{ env.env_DOCKER_DEPS_FILEPATH }}
          push: true
          tags: ${{ env.env_DEPS_ENV_PREFIX }}:${{ github.run_number }}

      - name: 8. upload json file to aliyun repository
        if: ${{ env.env_IS_FILES_MODIFIED_OR_ADDED == 'true' }}
        run: |
          pip install oss2
          python3 ${{github.workspace}}/bamboo/aliyun_oss/aliyun.py upload ${{ secrets.ALI_OSS_ACCESS_KEY_ID }} ${{ secrets.ALI_OSS_ACCESS_KEY_SK }} oss://icbench-static/environments/${{ github.repository }}/latest_docker_deps_image.json latest_docker_deps_image.json

      - name: 9. invoke workflow
        uses: benc-uk/workflow-dispatch@v1.1
        with:
          workflow: release eden regressions docker
          token: ${{ secrets.DEVOPS_GITHUB_ACCESSTOKEN }}
