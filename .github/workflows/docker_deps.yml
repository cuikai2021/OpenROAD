name: release eden deps docker
on: [workflow_dispatch]
      
jobs: 
  relesase-eden-deps-docker:
    runs-on: [self-hosted]

    steps:
        - name: 1. checkout
          uses: actions/checkout@v2

        - name: 2. connect to aliyun
          uses: manyuanrong/setup-ossutil@v2.0
          with:
            endpoint: "oss-cn-shanghai.aliyuncs.com"
            access-key-id: "${{ secrets.ALI_OSS_ACCESS_KEY_ID }}"
            access-key-secret: "${{ secrets.ALI_OSS_ACCESS_KEY_SK }}"
        
        - name: 3. download from aliyun
          run: ossutil cp -rf oss://icbench-static/environments/${{ github.repository }}/${{ github.ref }}/env.json .
        
        - name: 4. make varibles in json file into environment
          uses: antifree/json-to-variables@v1.0.1
          with:
           filename: 'env.json'
           prefix: env        

        - name: 5. combine and create DEPS_ENV
          uses: allenevans/set-env@v2.0.1
          with:
            DEPS_ENV: ${{ format('{0}:{1}', env.env_DEPS_ENV_PREFIX, github.run_number) }}

        - name: 6. login to acr
          if: ${{ env.env_IS_FILES_MODIFIED_OR_ADDED == 'true' }}
          uses: docker/login-action@v1
          with:
            registry: ${{ env.env_DOCKER_REGISTRY }}
            username: ${{ secrets.DOCKER_HUB_USERNAME }}
            password: ${{ secrets.DOCKER_HUB_PASSWORD }}

        - name: 7. build and push docker
          if: ${{ env.env_IS_FILES_MODIFIED_OR_ADDED == 'true' }}
          uses: docker/build-push-action@v2
          with:
            registry: ${{ env.env_DOCKER_REGISTRY }}
            username: ${{ secrets.DOCKER_HUB_USERNAME }}
            password: ${{ secrets.DOCKER_HUB_PASSWORD }}
            context: .
            file: ${{ env.env_DOCKER_DEPS_FILEPATH }}
            push: true
            tags: ${{ env.DEPS_ENV }}

        - name: 8. create json file to store environment variables
          uses: zynICBench/json-creator@v2.1
          if: ${{ env.env_IS_FILES_MODIFIED_OR_ADDED == 'true' }}
          with:
            file-name: 'latest_docker_deps_image.json'
            DEPS_ENV: ${{ env.DEPS_ENV }} 

        - name: 9. upload json file to aliyun repository
          if: ${{ env.env_IS_FILES_MODIFIED_OR_ADDED == 'true' }}
          run: ossutil cp -rf latest_docker_deps_image.json oss://icbench-static/environments/${{ github.repository }}/

        - name: 10. show docker image tag
          if: ${{ env.env_IS_FILES_MODIFIED_OR_ADDED == 'true' }}
          run: echo "docker pull tag is ${{ steps.build-and-push-docker.outputs.digest }}"

        - name: 11. invoke workflow
          uses: benc-uk/workflow-dispatch@v1.1
          with:
            workflow: relesase eden regressions docker
            token: ${{ secrets.DEVOPS_GITHUB_ACCESSTOKEN }}