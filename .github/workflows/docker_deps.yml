
name: deps-modify-checkout

on: 
  push:
    branches: devops-dev
  
jobs:
  relesase-eden-deps-docker:
    runs-on:  [self-hosts,linux]
    if: ${{ contains(github.event.head_commit.modified, 'docker/Dockerfile.deps')}}

    steps:
        - name: checkout
          uses: actions/checkout@v2
          with:
            ref: devops-dev

        - name: build-and-push-docker
          id: build-and-push-docker
          uses: risfeng/docker-image-build-push-action@v1.0
          with:
            name: docker-build 
            registry_url: 'registry.cn-shanghai.aliyuncs.com'
            namespaces: 'ieden'
            repository_name: env_eden_ubuntu
            user_name: ${{ secrets.DOCKER_HUB_USERNAME }}
            password: ${{ secrets.DOCKER_HUB_PASSWORD }}
            image_version: ${{github.run_number}
            docker_file: './docker/Dockerfile.deps'

        - name: show-docker-image-tag
          run: echo "docker pull tag is ${{ steps.build-and-push-docker.outputs.image_pull_url }}"