# This is a basic workflow to help you get started with Actions

name: update-deps

# Controls when the action will run.   触发机制
on: 
  push:
    branches: devops-dev
  
# A workflow run is made up of one or more jobs that can run sequentially or in parallel  任务
jobs:
  # This workflow contains a single job called "build"  
  relesase-eden-deps-docker:
    # The type of runner that the job will run on   运行环境
    runs-on:  [self-hosted, linux]
    env: 
      docker-image-tag-prefix: 'registry.cn-shanghai.aliyuncs.com/ieden/deps_eden_ubuntu:'
    if: ${{ contains(github.event.head_commit.modified, 'docker/docker_build_deps.sh') || contains(github.event.head_commit.modified, 'docker/Dockerfile.deps')}}
    # Steps represent a sequence of tasks that will be executed as part of the job  执行步骤
    steps:
      
        - name: docker-checkout
          uses: actions/checkout@v2
          
        - name: docker-get-tag
          run: 
            tag: ${{env.docker-image-tag-prefix}}$GITHUB_RUN_NUMBER
          
        - name: docker-build
          run: sh docker/docker_build_deps.sh ${{ tag }}