name: deps-modify-checkout

on: 
  push:
    branches: 
      - devops-dev
  
jobs:
  relesase-eden-deps-docker:
    runs-on:  [self-hosted]
    env:
          DOCKER_REGISTRY: registry.cn-shanghai.aliyuncs.com
          DOCKER_NAMESPACE: ieden
          DOCKER_DEPS_IMAGENAME: env_eden_ubuntu
          DOCKER_DEPS_FILEPATH: docker/Dockerfile.deps

    steps:
        - name: checkout
          uses: actions/checkout@v2

        - name: files-filter
          uses: dorny/paths-filter@v2
          id: filter
          with:
            filters: |
              modified:
                - '.github/workflows/docker_deps.yml'
                - ${{ env.DOCKER_DEPS_FILEPATH }}
                - 'etc/DependencyInstaller.sh'
              
        - name: build-and-push-docker
          if: ${{ steps.filter.outputs.modified == 'true' }}
          id: build-and-push-docker
          uses: docker/build-push-action@v2
          with:
            registry: ${{ env.DOCKER_REGISTRY }}
            username: ${{ secrets.DOCKER_HUB_USERNAME }}
            password: ${{ secrets.DOCKER_HUB_PASSWORD }}
            context: .
            file: ${{ env.DOCKER_DEPS_FILEPATH }}
            push: true
            tags: ${{ format('{0}/{1}/{2}:{3}', env.DOCKER_REGISTRY, env.DOCKER_NAMESPACE, env.DOCKER_DEPS_IMAGENAME, github.run_number) }}

        - name: show-docker-image-tag
          if: ${{ success() }}
          run: echo "docker pull tag is ${{ steps.build-and-push-docker.outputs.digest }}"