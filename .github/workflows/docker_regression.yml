name: dockerfile-regression-build-and-run

on: 
  push:
    branch: devops-dev

jobs:
  relesase-eden-regressions-docker:
    runs-on:  [self-hosted]
    env:
          DOCKER_REGISTRY: registry.cn-shanghai.aliyuncs.com
          DOCKER_NAMESPACE: ieden
          DOCKER_REGRESSION_IMAGENAME: eden_regression_ubuntu
          DOCKER_REGRESSION_FILEPATH: docker/Dockerfile.regression
          ALI_ACCESS_KEY_ID: ${{ secrets.ALI_OSS_ACCESS_KEY_ID }}
          ALI_ACCESS_KEY_SECRET: ${{ secrets.ALI_OSS_ACCESS_KEY_SK }}
          TRIGGER_FROM: push
          GIT_HEAD: ${{ github.event.head_commit.id }}
          ISSUE_ASSIGNEE: ${{ github.event.head_commit.committer.name }}
          REGRESSION_BRANCH: ${{ github.ref }}
          GITHUB_API_TOKEN: ${{ secrets.DEVOPS_GITHUB_ACCESSTOKEN }}

    steps:
        - name: checkout
          uses: actions/checkout@v2

        - name: set-env
          uses: allenevans/set-env@v2.0.1
          with:
            REGRESSION_ENV: ${{ format('{0}/{1}/{2}:{3}', env.DOCKER_REGISTRY, env.DOCKER_NAMESPACE, env.DOCKER_REGRESSION_IMAGENAME, github.run_number) }}

        - name: build-docker-regression
          uses: docker/build-push-action@v2
          with:
            registry: ${{ env.DOCKER_REGISTRY }}
            username: ${{ secrets.DOCKER_HUB_USERNAME }}
            password: ${{ secrets.DOCKER_HUB_PASSWORD }}
            context: .
            file: ${{ env.DOCKER_REGRESSION_FILEPATH }}
            push: false
            tags: ${ REGRESSION_ENV }
            
        - name: run-regression
          if: ${{ success() }}
          run: ./docker_run/docker_run_regression.sh ${{ GITHUB_WORKSPACE }} ${ REGRESSION_ENV }

        - name: show-success-log
          if: ${{ success() }}
          run: echo "successfully run"