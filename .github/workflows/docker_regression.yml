name: run regression
on: 
  push:     
    branches:
      - devops-dev
  workflow_dispatch:
    
jobs:
  set-env:
    runs-on: [self-hosted]

    steps:
      - name: 1.checkout bamboo 
        uses: actions/checkout@v2
        with:
          repository: ICBench/bamboo
          ref: v0.2.4
          token: ${{ secrets.DEVOPS_GITHUB_ACCESSTOKEN }}
          path: ${{ github.workspace }}/bamboo
       
      - name: 2. invoke workflow
        run: |
          cd ${{ github.workspace }}/bamboo
          source ./modules/github_api/util.sh
          github trigger \
              --token ${{ secrets.DEVOPS_GITHUB_ACCESSTOKEN }} \
              --usr "zynICBench" \
              --repo "bamboo" \
              --workflow "eden_deps.yml" \
              --ref pass_release