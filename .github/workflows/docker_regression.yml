name: run regression
on: 
  push:     
    branches:
      - devops-dev
  workflow_dispatch:
    
jobs:
  set-env:
    runs-on: ubuntu-latest

    steps:
      - name: 1. get repo owner
        run: |
          repo=${{ github.repository }}
          echo "REPO_OWNER=${repo%/*}" >> $GITHUB_ENV
          
      - name: 2. invoke workflow
        uses: benc-uk/workflow-dispatch@v1.1
        with:
          repo: ${{ env.REPO_OWNER }}/bamboo
          ref: master
          workflow: release eden regressions docker
          token: ${{ secrets.DEVOPS_GITHUB_ACCESSTOKEN }}