name: relesase eden regressions docker
on: [workflow_dispatch]

jobs: 
  relesase-eden-regressions-docker:
    runs-on: [self-hosted]

    steps:
        - name: checkout
          uses: actions/checkout@v2
          with:
            submodules: true
        
        - name: download from aliyun
          uses: manyuanrong/setup-ossutil@v2.0
          with:
            endpoint: "oss-cn-shanghai.aliyuncs.com"
            access-key-id: "${{secrets.ALI_OSS_ACCESS_KEY_ID}}"
            access-key-secret: "${{secrets.ALI_OSS_ACCESS_KEY_SK}}"
        - run: ossutil cp -rf oss://icbench-static/environments/${{github.repository}}/${{github.ref}}/env.json .
        - run: ossutil cp -rf oss://icbench-static/environments/${{github.repository}}/${{github.ref}}/latest_docker_deps_image.json .
      
        - name: json reader
          uses: antifree/json-to-variables@v1.0.1
          with:
           filename: 'env.json'
           prefix: env

        - uses: antifree/json-to-variables@v1.0.1
          with:
           filename: 'latest_docker_deps_image.json'
           prefix: env

        - name: build docker regression
          if: ${{ success() }}
          uses: docker/build-push-action@v2
          with:
            context: .
            file: ${{ env.env_DOCKER_REGRESSION_FILEPATH }}
            build-args: |
              FROM_IMAGE_TAG=${{ env.env_DEPS_ENV }}
            push: false
            tags: ${{ env.env_REGRESSION_ENV }}


        - if: ${{ success() }}
          run: mkdir -p ${{ env.env_DOCKER_RESULT_PATH }}

        - name: run regression
          if: ${{ success() }}
          run: ./docker_run/docker_run_regression.sh ${{ env.env_DOCKER_RESULT_PATH }}

        - if: ${{ success() }}
          run: |
              is_empty_dir(){ 
              return `ls -A $1|wc -w`
              }
              if [is_empty_dir(${{ env.env_DOCKER_RESULT_PATH }})==0]
              then 
                echo "EXIST_REGRESSION_FAILURES=false" >> $GITHUB_ENV
              else 
                echo "EXIST_REGRESSION_FAILURES=true" >> $GITHUB_ENV
                for file in ${{ env.env_DOCKER_RESULT_PATH }}/*; do
                  echo "REGRESSION_FAILURES_FILE=$file" >> $GITHUB_ENV
                  break
                done
              fi

        - if: ${{ success() }}
          run: |
              echo ${{ env.EXIST_REGRESSION_FAILURES }}
              echo ${{ env.REGRESSION_FAILURES_FILE }}
 
        - if: ${{ env.EXIST_REGRESSION_FAILURES == true }}
          run: ossutil cp -rf ${{ env.env_DOCKER_RESULT_PATH }}/${{ env.REGRESSION_FAILURES_FILE }} oss://icbench-devops/regression-${{github.run_number)}}/

        - name: success pull request
          if: ${{ env.EXIST_REGRESSION_FAILURES == false }}
          uses: octokit/request-action@v2.x
          id: pulls
          with:
            route: POST /repos/{owner}/{repo}/pulls
            owner: ${{github.actor}}
            repo: ${{github.repository}}
            head_sha: ${{ github.sha }}
            title: "success pull request"
            base: ${{github.ref}}
            head: master
            labels: "CI"
            body: 
               "Message is ${{env.env_HEAD_COMMIT_MESSAGE}}. The branch is ${{github.ref}}. The action sha value is ${{env.env_EVENT_AFTER}}."
          env:
            GITHUB_TOKEN: ${{ secrets.DEVOPS_GITHUB_ACCESSTOKEN }}

        - name: failure issue
          if: ${{ env.EXIST_REGRESSION_FAILURES == true }}
          uses: octokit/request-action@v2.x
          id: issues
          with:
            route: POST /repos/{owner}/{repo}/issues
            owner: ${{github.actor}}
            repo: ${{github.repository}}
            title: "failure issue"
            labels: "CI"
            assignees: ${{env.env_HEAD_COMMIT_COMMITER_NAME}}
            body: |
               "Message is ${{env.env_HEAD_COMMIT_MESSAGE}}. The branch is ${{github.ref}}. The action sha value is ${{env.env_EVENT_AFTER}}."
          env:
             GITHUB_TOKEN: ${{ secrets.DEVOPS_GITHUB_ACCESSTOKEN }}