name: relesase eden regressions docker
on:
  workflow_dispatch:
      branches: [devops-dev]
      
jobs: 
  relesase-eden-regressions-docker:
    needs: relesase-eden-deps-docker
    runs-on:  [self-hosted]

    steps:
        - name: checkout
          uses: actions/checkout@v2
          with:
            submodules: true
        
        - name: download from aliyun
          uses: manyuanrong/setup-ossutil@v2.0
          with:
            endpoint: "oss-cn-shanghai.aliyuncs.com"
            access-key-id: "${{secrets.ALI_OSS_ACCESS_KEY_ID}}"
            access-key-secret: "${{secrets.ALI_OSS_ACCESS_KEY_SK}}"
        - run: ossutil cp -rf oss://icbench-static/environments/${{github.repository}}/${{github.event.ref}}/env.json .
      
        - name: json reader
          uses: antifree/json-to-variables@v1.0.1
          with:
           filename: 'env.json'
           prefix: env

        - if: ${{github.actor == 'ICBench'}}
          uses: allenevans/set-env@v2.0.1
          with:
            DOCKER_REGRESSION_IMAGENAME: ${{env.env_DOCKER_REGRESSION_IMAGENAME}}

        - if: ${{github.actor != 'ICBench'}}
          uses: allenevans/set-env@v2.0.1
          with:
            DOCKER_REGRESSION_IMAGENAME: ${{env.env_DOCKER_REGRESSION_IMAGENAME_TEST}}

        - uses: allenevans/set-env@v2.0.1
          with:
            REGRESSION_ENV: ${{ format('{0}/{1}/{2}:{3}', env.env_DOCKER_REGISTRY, env.env_DOCKER_NAMESPACE, env.DOCKER_REGRESSION_IMAGENAME, github.run_number) }}

        - name: build docker regression
          if: ${{ success() }}
          uses: docker/build-push-action@v2
          with:
            context: .
            file: ${{ env.env_DOCKER_REGRESSION_FILEPATH }}
            push: false
            tags: ${{ env.REGRESSION_ENV }}
            
        - run: mkdir -p ${{ env.env_DOCKER_RESULT_PATH }}

        - name: run regression
          if: ${{ success() }}
          run: ./docker_run/docker_run_regression.sh ${{ env.env_DOCKER_RESULT_PATH }}

        - name: show success log
          if: ${{ success() }}
          run: echo "successfully run"