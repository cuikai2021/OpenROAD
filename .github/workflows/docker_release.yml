name: docker release
on:
  workflow_dispatch:
    inputs:
      commit_id:
        description: 'commit id of repo(Eden) to make it'
        required: true
      release_name:
        description: 'docker release name, like 0409p2'
        required: true
env:
  RELEASE_ENV: registry.cn-shanghai.aliyuncs.com/ieden/eden_release_ubuntu:${{github.event.inputs.release_name}}
  DOCKER_REGISTRY: registry.cn-shanghai.aliyuncs.com
jobs:
  release:
    runs-on: [self-hosted]
    steps:
        - name: checkout
          uses: actions/checkout@v2
          with: 
            ref: ${{ github.event.inputs.inputs.commit_id }}

        - name: connect to aliyun
          uses: manyuanrong/setup-ossutil@v2.0
          with:
            endpoint: "oss-cn-shanghai.aliyuncs.com"
            access-key-id: "${{secrets.ALI_OSS_ACCESS_KEY_ID}}"
            access-key-secret: "${{secrets.ALI_OSS_ACCESS_KEY_SK}}"
        - name: download from aliyun
          run: ossutil cp -rf oss://icbench-static/environments/${{github.repository}}/latest_docker_deps_image.json .
        
        - uses: antifree/json-to-variables@v1.0.1
          with:
           filename: 'latest_docker_deps_image.json'
           prefix: env

        - name: login to acr
          uses: docker/login-action@v1
          with:
            registry: ${{ env.DOCKER_REGISTRY }}
            username: ${{ secrets.DOCKER_HUB_USERNAME }}
            password: ${{ secrets.DOCKER_HUB_PASSWORD }}

        - name: build and push docker
          id: build-and-push-docker
          uses: docker/build-push-action@v2
          with:
            registry: ${{ env.DOCKER_REGISTRY }}
            username: ${{ secrets.DOCKER_HUB_USERNAME }}
            password: ${{ secrets.DOCKER_HUB_PASSWORD }}
            context: .
            build-args: FROM_IMAGE_TAG=${{ env.env_DEPS_ENV }}
            file: docker/Dockerfile.release
            push: true
            tags: ${{ env.RELEASE_ENV }}

        - run: mkdir -p ${{ github.workspace}}/release-output
         
        - name: run release
          run: ./docker_run/docker_run_release.sh ${{ github.workspace }}/release-output ${{ env.RELEASE_ENV }}

        - name: generate changelog
          run: echo "# release success" > ${{ github.workflow }}-CHANGELOG.txt
        - name: release
          uses: softprops/action-gh-release@v1
          with:
            body_path: ${{ github.workflow }}-CHANGELOG.txt
            files: |
              ${{github.workspace}}/build/eden
              ${{github.workspace}}/build/openroad
          env:
            GITHUB_TOKEN: ${{ secrets.DEVOPS_GITHUB_ACCESSTOKEN }}