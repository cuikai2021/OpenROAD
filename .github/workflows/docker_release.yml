name: docker release
on:
  workflow_dispatch:
    inputs:
      Eden_commit_id:
        description: "commit id of Eden to make it"
        required: true
        default: master
      yosys_commit_id:
        description: "commit id of yosys to make it"
        default: master
        required: true
      maple_commit_id:
        description: "commit id of maple to make it"
        default: master
        required: true
      release_name:
        description: "docker release name, like 210712(date)"
        default: today
        required: true

jobs:
  release:
    runs-on: [self-hosted]
    steps:
      - name: invoke workflow
        uses: benc-uk/workflow-dispatch@v1.1
        with:
          token: ${{ secrets.DEVOPS_GITHUB_ACCESSTOKEN }}
          repo: ICBench/bamboo
          ref: v0.3
          workflow: release
          inputs: '{ "Eden_commit_id": "${{ github.event.inputs.Eden_commit_id }}", "yosys_commit_id": "${{ github.event.inputs.yosys_commit_id }}", "maple_commit_id": "${{ github.event.inputs.maple_commit_id }}", "release_name": "${{ github.event.inputs.release_name }}"}'