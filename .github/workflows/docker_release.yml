name: docker release
on:
  workflow_dispatch:
    inputs:
      Eden_commit_id:
        description: "commit id of Eden to make it"
        required: true
        default: master
      yosys_commit_id:
        description: "commit id of yosys to make it"
        default: master
        required: true
      maple_commit_id:
        description: "commit id of maple to make it"
        default: master
        required: true
      bamboo_commit_id:
        description: "commit id of bamboo to make it"
        default: master
        required: true
      release_name:
        description: "docker release name, like 210712(date)"
        default: today
        required: true

env:
  DOCKER_REGISTRY: registry.cn-shanghai.aliyuncs.com

jobs:
  release:
    runs-on: [self-hosted]
    steps:
      - name: 1. checkout deps
        uses: actions/checkout@v2
        with:
          ref: master
          path: ${{ github.workspace }}/Eden

      - name: 2. checkout eden
        uses: actions/checkout@v2
        with:
          submodules: true
          repository: ICBench/Eden
          token: ${{ secrets.DEVOPS_GITHUB_ACCESSTOKEN }}
          ref: ${{ github.event.inputs.Eden_commit_id }}
          path: ${{ github.workspace }}/Eden-src

      - name: 3. checkout yosys
        uses: actions/checkout@v2
        with:
          repository: ICBench/yosys
          token: ${{ secrets.DEVOPS_GITHUB_ACCESSTOKEN }}
          ref: ${{ github.event.inputs.yosys_commit_id }}
          path: ${{ github.workspace }}/yosys

      - name: 4. checkout abc
        uses: actions/checkout@v2
        with:
          repository: YosysHQ/abc
          token: ${{ secrets.DEVOPS_GITHUB_ACCESSTOKEN }}
          ref: 341db25668f3054c87aa3372c794e180f629af5d
          path: ${{ github.workspace }}/yosys/abc

      - name: 5. checkout maple
        uses: actions/checkout@v2
        with:
          submodules: true
          repository: ICBench/maple
          ref: ${{ github.event.inputs.maple_commit_id }}
          token: ${{ secrets.DEVOPS_GITHUB_ACCESSTOKEN }}
          path: ${{ github.workspace }}/maple

      - name: 6. checkout bamboo
        uses: actions/checkout@v2
        with:
          repository: ICBench/bamboo
          ref: ${{ github.event.inputs.bamboo_commit_id }}
          token: ${{ secrets.DEVOPS_GITHUB_ACCESSTOKEN }}
          path: ${{ github.workspace }}/bamboo

      - name: 7. set date if needed
        if: ${{ github.event.inputs.release_name == 'today' }}
        run: |
          date=$(date +%y%m%d)
          echo "RELEASE_ENV=registry.cn-shanghai.aliyuncs.com/ieden/eden_release_ubuntu:$date" >> $GITHUB_ENV
          echo "release_name=$date" >> $GITHUB_ENV

      - name: 7. set date if not needed
        if: ${{ github.event.inputs.release_name != 'today' }}
        run: |
          echo "RELEASE_ENV=registry.cn-shanghai.aliyuncs.com/ieden/eden_release_ubuntu:${{ github.event.inputs.release_name }}" >> $GITHUB_ENV
          echo "release_name=${{ github.event.inputs.release_name }}" >> $GITHUB_ENV
          apt-key adv --recv-keys --keyserver keyserver.ubuntu.com 8B57C5C2836F4BEB
        
      - name: 8. make varibles in json file into environment
        uses: antifree/json-to-variables@v1.0.1
        with:
          filename: "latest_docker_deps_image.json"
          prefix: env

      - name: 9. login to acr
        uses: docker/login-action@v1
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: 10. get sha1 and put into env variable
        run: |
          EDEN_GIT_SHA1=`git rev-parse HEAD`
          echo "EDEN_GIT_SHA1=$EDEN_GIT_SHA1" >> $GITHUB_ENV

      - name: 11. build and push docker
        uses: docker/build-push-action@v2
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
          context: .
          build-args: |
            DEPS_IMAGE_TAG=${{ env.env_DEPS_ENV }}
            EDEN_GIT_SHA1=${{ env.EDEN_GIT_SHA1 }}
          file: |
            docker/Dockerfile.release
          push: true
          tags: ${{ env.RELEASE_ENV }}

      - name: 12. lite smoke
        run: ./${{ github.workspace}}/bamboo/modules/lite_smoke/lite_smoke.sh ${{ RELEASE_ENV }}

      - name: 13. generate changelog
        run: |
          echo "**release success**" > CHANGELOG.txt
          echo "eden commit id: ${{ github.event.inputs.Eden_commit_id }}" >> CHANGELOG.txt
          echo "yosys commit id: ${{ github.event.inputs.yosys_commit_id }}" >> CHANGELOG.txt
          echo "abc commit id: 341db25668f3054c87aa3372c794e180f629af5d" >> CHANGELOG.txt
          echo "maple commit id: ${{ github.event.inputs.maple_commit_id }}" >> CHANGELOG.txt
          echo "bamboo commit id: ${{ github.event.inputs.bamboo_commit_id }}" >> CHANGELOG.txt
          echo "**docker id**: ${{ env.RELEASE_ENV }}" >> CHANGELOG.txt

      - name: 14. release
        uses: softprops/action-gh-release@v1
        with:
          body_path: CHANGELOG.txt
          tag_name: release_${{ env.release_name }}

        env:
          GITHUB_TOKEN: ${{ secrets.DEVOPS_GITHUB_ACCESSTOKEN }}

      - name: 15. delete release image
        if: ${{ always() }}
        run: |
          docker rmi ${{ env.RELEASE_ENV }}

      
