name: docker release
on:
  workflow_dispatch:
    inputs:
      Eden_commit_id:
        description: "commit id of Eden to make it"
        required: false
        default: master
      yosys_commit_id:
        description: "commit id of yosys to make it"
        default: master
        required: false
      maple_commit_id:
        description: "commit id of maple to make it"
        default: master
        required: false
      release_name:
        description: "docker release name, like 210712(date)"
        default: today
        required: true

env:
  RELEASE_ENV: registry.cn-shanghai.aliyuncs.com/ieden/eden_release_ubuntu:${{ github.event.inputs.release_name }}
  DOCKER_REGISTRY: registry.cn-shanghai.aliyuncs.com

jobs:
  release:
    runs-on: [self-hosted]
    steps:
      - name: 1. checkout deps
        uses: actions/checkout@v2
        with:
          ref: master
          path: ${{ github.workspace }}/Eden

      - name: 2. checkout eden
        uses: actions/checkout@v2
        with:
          submodules: true
          repository: ICBench/Eden
          token: ${{ secrets.DEVOPS_GITHUB_ACCESSTOKEN }}
          ref: ${{ github.event.inputs.Eden_commit_id }}
          path: ${{ github.workspace }}/Eden-src

      - name: 2. checkout yosys
        uses: actions/checkout@v2
        with:
          repository: ICBench/yosys
          token: ${{ secrets.DEVOPS_GITHUB_ACCESSTOKEN }}
          ref: ${{ github.event.inputs.yosys_commit_id }}
          path: ${{ github.workspace }}/yosys

      - name: 3. checkout abc
        uses: actions/checkout@v2
        with:
          repository: YosysHQ/abc
          token: ${{ secrets.DEVOPS_GITHUB_ACCESSTOKEN }}
          ref: 341db25668f3054c87aa3372c794e180f629af5d
          path: ${{ github.workspace }}/yosys/abc

      - name: 3. checkout maple
        uses: actions/checkout@v2
        with:
          submodules: true
          repository: ICBench/maple
          ref: ${{ github.event.inputs.maple_commit_id }}
          token: ${{ secrets.DEVOPS_GITHUB_ACCESSTOKEN }}
          path: ${{ github.workspace }}/maple

      - name: 4. checkout bamboo
        uses: actions/checkout@v2
        with:
          repository: ICBench/bamboo
          ref: master
          token: ${{ secrets.DEVOPS_GITHUB_ACCESSTOKEN }}
          path: ${{ github.workspace }}/bamboo

      - name: set date if needed
        if: ${{ github.event.inputs.release_name == 'today' }}
        run: |
          date=$(date +%y%m%d)
          echo "RELEASE_ENV=registry.cn-shanghai.aliyuncs.com/ieden/eden_release_ubuntu:$date" >> $GITHUB_ENV
          echo "release_name=$date" >> $GITHUB_ENV
        
      # - name: 1. connect to aliyun
      #   uses: manyuanrong/setup-ossutil@v2.0
      #   with:
      #     endpoint: "oss-cn-shanghai.aliyuncs.com"
      #     access-key-id: "${{ secrets.ALI_OSS_ACCESS_KEY_ID }}"
      #     access-key-secret: "${{ secrets.ALI_OSS_ACCESS_KEY_SK }}"

      # - name: 2. download from aliyun
      #   run: |
      #     pip install oss2
      #     ossutil cp -rf oss://icbench-static/environments/repo_backup ${{ github.workspace }}/
      #     cp -r ${{ github.workspace }}/repo_backup/* ${{ github.workspace }}
      #     export PYTHONPATH="${{ github.workspace }}/bamboo"
      #     python3 ${{ github.workspace }}/bamboo/modules/aliyun_oss/aliyun.py download ${{ secrets.ALI_OSS_ACCESS_KEY_ID }} ${{ secrets.ALI_OSS_ACCESS_KEY_SK }} oss://icbench-static/environments/${{ github.repository }}/latest_docker_deps_image.json latest_docker_deps_image.json

      - name: 3. make varibles in json file into environment
        uses: antifree/json-to-variables@v1.0.1
        with:
          filename: "latest_docker_deps_image.json"
          prefix: env

      - name: 4. login to acr
        uses: docker/login-action@v1
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: 5. get sha1 and put into env variable
        run: |
          EDEN_GIT_SHA1=`git rev-parse HEAD`
          echo "EDEN_GIT_SHA1=$EDEN_GIT_SHA1" >> $GITHUB_ENV

      - name: 6. build and push docker
        uses: docker/build-push-action@v2
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
          context: .
          build-args: |
            DEPS_IMAGE_TAG=${{ env.env_DEPS_ENV }}
            EDEN_GIT_SHA1=${{ env.EDEN_GIT_SHA1 }}
          file: |
            docker/Dockerfile.release
          push: true
          tags: ${{ env.RELEASE_ENV }}

      - name: 7. generate changelog
        run: |
          echo "## release success" > CHANGELOG.txt
          echo "### eden commit id: ${{ github.event.inputs.Eden_commit_id }}" >> CHANGELOG.txt
          echo "### yosys commit id: ${{ github.event.inputs.yosys_commit_id }}" >> CHANGELOG.txt
          echo "### docker id: ${{ env.RELEASE_ENV }}" >> CHANGELOG.txt

      - name: 8. release
        uses: softprops/action-gh-release@v1
        with:
          body_path: CHANGELOG.txt
          tag_name: release_${{ github.event.inputs.release_name }}

        env:
          GITHUB_TOKEN: ${{ secrets.DEVOPS_GITHUB_ACCESSTOKEN }}

      - name: 9. delete deps and release image
        if: ${{ always() }}
        run: |
          docker rmi ${{ env.RELEASE_ENV }}
