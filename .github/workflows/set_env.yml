name: set env
on: 
  push:
    branches:
      - devops-dev
jobs:
  set-env:
    runs-on: [self-hosted]
    env:
      DOCKER_REGISTRY: registry.cn-shanghai.aliyuncs.com
      DOCKER_NAMESPACE: ieden
      DOCKER_DEPS_IMAGENAME: eden_deps_ubuntu
      DOCKER_DEPS_IMAGENAME_TEST: eden_deps_ubuntu_test
      DOCKER_REGRESSION_IMAGENAME: eden_regression_ubuntu
      DOCKER_REGRESSION_IMAGENAME_TEST: eden_regression_test
       
    steps:
      - name: 1. checkout
        uses: actions/checkout@v2

      - name: 2. ICBench image version
        if: ${{ github.actor == 'ICBench' }}
        uses: allenevans/set-env@v2.0.1
        with:
          DOCKER_DEPS_IMAGENAME: ${{ env.DOCKER_DEPS_IMAGENAME }}
          DOCKER_REGRESSION_IMAGENAME: ${{ env.DOCKER_REGRESSION_IMAGENAME }}

      - name: 2. test image version
        if: ${{ github.actor != 'ICBench' }}
        uses: allenevans/set-env@v2.0.1
        with:
          DOCKER_DEPS_IMAGENAME: ${{ env.DOCKER_DEPS_IMAGENAME_TEST }}
          DOCKER_REGRESSION_IMAGENAME: ${{ env.DOCKER_REGRESSION_IMAGENAME_TEST }}

      - name: 3. monitor file change
        id: change
        uses: trilom/file-changes-action@v1.2.4
        with:
          githubToken: ${{ secrets.DEVOPS_GITHUB_ACCESSTOKEN }}
          pushBefore: ${{ github.event.before }}
          pushAfter: ${{ github.event.after }}

      - name: 4. decide committer name
        run: |
            name1=${{ github.event.commits[0].committer.name }}
            name2=${{ github.event.commits[1].committer.name }}
            if [ $name1 == 'GitHub' ]
            then 
                echo "COMMIT_COMMITER_NAME=$name2" >> $GITHUB_ENV
            else 
                echo "COMMIT_COMMITER_NAME=$name1" >> $GITHUB_ENV
            fi

      - name: 5. create json file to store environment variables
        uses: zynICBench/json-creator@v2.1
        with:
          file-name: 'env.json'
          DOCKER_REGISTRY: ${{ env.DOCKER_REGISTRY }}
          DOCKER_DEPS_FILEPATH: docker/Dockerfile.deps
          DOCKER_REGRESSION_FILEPATH: docker/Dockerfile.regression
          DOCKER_RESULT_PATH: ${{ github.workspace }}/devops_results
          CODE_COVERAGE_PATH: ${{ github.workspace }}/coverage_results
          IS_FILES_MODIFIED_OR_ADDED: ${{ contains(steps.change.outputs.files, '.github/workflows/docker_deps.yml') || contains(steps.change.outputs.files, 'docker/Dockerfile.dev') || contains(steps.change.outputs.files, 'etc/DependencyInstaller.sh') }}  
          DEPS_ENV_PREFIX: ${{ format('{0}/{1}/{2}', env.DOCKER_REGISTRY, env.DOCKER_NAMESPACE, env.DOCKER_DEPS_IMAGENAME) }}
          REGRESSION_ENV: ${{ format('{0}/{1}/{2}:{3}', env.DOCKER_REGISTRY, env.DOCKER_NAMESPACE, env.DOCKER_REGRESSION_IMAGENAME, github.run_number) }}
          COMMIT_COMMITER_NAME: ${{ env.COMMIT_COMMITER_NAME }}
          EVENT_AFTER: ${{ github.event.after }}
          
      - name: 6. connect to aliyun
        uses: manyuanrong/setup-ossutil@v2.0
        with:
          endpoint: "oss-cn-shanghai.aliyuncs.com"
          access-key-id: "${{ secrets.ALI_OSS_ACCESS_KEY_ID }}"
          access-key-secret: "${{ secrets.ALI_OSS_ACCESS_KEY_SK }}"

      - name: 7. upload to aliyun
        run: ossutil cp -rf env.json oss://icbench-static/environments/${{ github.repository }}/${{ github.event.ref }}/

      - name: 8. invoke workflow
        uses: benc-uk/workflow-dispatch@v1.1
        with:
          workflow: release eden deps docker
          token: ${{ secrets.DEVOPS_GITHUB_ACCESSTOKEN }}